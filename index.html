html,body{height:100%}*{box-sizing:border-box}

.qt{font-weight:700;border:1px solid var(--line);border-radius:10px;padding:4px 12px}
a.yt{background:#dc2626;color:#fff;text-decoration:none;font-weight:700;font-size:1.05rem;padding:14px 22px;border-radius:14px;min-height:50px;display:flex;align-items:center}
.lb{position:absolute;top:22px;font-weight:900;font-size:1.3rem;border:4px solid;border-radius:10px;padding:2px 12px;opacity:0;pointer-events:none}

F pontuação arbitragem"},{"n":"Defesa pessoal","q":6,"y":"defesa pessoal jiu jitsu passo a passo"},{"n":"Rolamentos e fuga de quadril","q":-1,"y":"rolamentos e fuga de quadril jiu jitsu passo a passo"},{"n":"Quedas com nome","q":6,"y":"quedas com nome jiu jitsu passo a passo"},{"n":"Raspagem guarda-fechada","q":4,"y":"raspagem guarda fechada jiu jitsu passo a passo"},{"n":"Raspagem guarda-aberta","q":4,"y":"raspagem guarda aberta jiu jitsu passo a passo"},{"n":"Raspagem meia-guarda","q":4,"y":"raspagem meia guarda jiu jitsu passo a passo"},{"n":"Raspagem guarda-aranha e/ou de lapela","q":2,"y":"raspagem guarda aranha e/ou de lapela jiu jitsu passo a passo"},{"n":"Raspagem com gancho de la riva e/ou berimbolo","q":2,"y":"raspagem com gancho de la riva e/ou berimbolo jiu jitsu passo a passo"},{"n":"Raspagem guarda-x","q":2,"y":"raspagem guarda x jiu jitsu passo a passo"},{"n":"Arm-lock na guarda","q":4,"y":"arm lock na guarda jiu jitsu passo a passo"},{"n":"Defesa de arm-lock na guarda","q":2,"y":"defesa de arm lock na guarda jiu jitsu passo a passo"},{"n":"Arm-lock invertido","q":2,"y":"arm lock invertido jiu jitsu passo a passo"},{"n":"Triângulo","q":4,"y":"triângulo jiu jitsu passo a passo"},{"n":"Defesa de triângulo","q":2,"y":"defesa de triângulo jiu jitsu passo a passo"},{"n":"Triângulo invertido","q":1,"y":"triângulo invertido jiu jitsu passo a passo"},{"n":"Triângulo de braço","q":1,"y":"triângulo de braço jiu jitsu passo a passo"},{"n":"Americana","q":4,"y":"americana jiu jitsu passo a passo"},{"n":"Kimura","q":4,"y":"kimura jiu jitsu passo a passo"},{"n":"Omoplata","q":4,"y":"omoplata jiu jitsu passo a passo"},{"n":"Defesa de omoplata","q":2,"y":"defesa de omoplata jiu jitsu passo a passo"},{"n":"Omoplata invertida","q":1,"y":"omoplata invertida jiu jitsu passo a passo"},{"n":"Arco e flexa","q":3,"y":"arco e flexa jiu jitsu passo a passo"},{"n":"Relógio","q":3,"y":"relógio jiu jitsu passo a passo"},{"n":"Defesa de relógio","q":2,"y":"defesa de relógio jiu jitsu passo a passo"},{"n":"Guilhotina","q":2,"y":"guilhotina jiu jitsu passo a passo"},{"n":"Defesa guilhotina","q":1,"y":"defesa guilhotina jiu jitsu passo a passo"},{"n":"Katagatame","q":1,"y":"katagatame jiu jitsu passo a passo"},{"n":"Mão – de – vaca","q":4,"y":"mão de vaca jiu jitsu passo a passo"},{"n":"Pata – de – vaca","q":4,"y":"pata de vaca jiu jitsu passo a passo"},{"n":"Leg-lock","q":4,"y":"leg lock jiu jitsu passo a passo"},{"n":"Defesa de leg-lock","q":1,"y":"defesa de leg lock jiu jitsu passo a passo"},{"n":"Chave de bíceps","q":1,"y":"chave de bíceps jiu jitsu passo a passo"},{"n":"Chave de pé (reta)","q":2,"y":"chave de pé (reta) jiu jitsu passo a passo"},{"n":"Chave de panturrilha","q":1,"y":"chave de panturrilha jiu jitsu passo a passo"},{"n":"Passagem de guarda","q":4,"y":"passagem de guarda jiu jitsu passo a passo"},{"n":"Passagem partindo da meia - guarda","q":3,"y":"passagem partindo da meia guarda jiu jitsu passo a passo"},{"n":"Técnicas para obter as costas","q":4,"y":"técnicas para obter as costas jiu jitsu passo a passo"},{"n":"Técnicas para chegar à montada","q":4,"y":"técnicas para chegar à montada jiu jitsu passo a passo"},{"n":"Saida montada","q":4,"y":"saida montada jiu jitsu passo a passo"},{"n":"Saida cem quilos","q":4,"y":"saida cem quilos jiu jitsu passo a passo"},{"n":"Saida joelho na barriga","q":2,"y":"saida joelho na barriga jiu jitsu passo a passo"},{"n":"Saida norte-sul","q":1,"y":"saida norte sul jiu jitsu passo a passo"},{"n":"Didática","q":0,"y":"didática ensinar jiu-jitsu como dar aula"}]}]};
const TH={Cinza:["#6B7280","#fff"],Amarela:["#EAB308","#18181b"],Laranja:["#EA580C","#fff"],Verde:["#16A34A","#fff"],Azul:["#2563EB","#fff"],Roxa:["#7C3AED","#fff"],Marrom:["#78350F","#fff"],Preta:["#18181B","#fff"]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kind=n=>{n=n.toLowerCase();return /histórico|didática/.test(n)?["📖","Teoria"]:/situação de luta/.test(n)?["⚖️","Arbitragem"]:/^defesa/.test(n)?["🛡️","Defesa"]:/^quedas/.test(n)?["🤼","Quedas"]:/rolamentos|fuga de quadril|amarrar/.test(n)?["🔄","Fundamentos"]:/^raspagem/.test(n)?["🌀","Raspagem"]:/passagem/.test(n)?["🏃","Passagem"]:/^sa[ií]da/.test(n)?["🚪","Saída"]:/lock|tri[âa]ngulo|mata|gola|americana|kimura|omoplata|rel[óo]gio|estrangulamento|guilhotina|arco e flexa|vaca|katagatame|chave|b[íi]ceps|panturrilha/.test(n)?["🔒","Finalização"]:/guarda|abertura/.test(n)?["🦵","Guarda"]:["📍","Posição"]};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const yt=i=>"https://www.youtube.com/results?search_query="+encodeURIComponent(i.y);
let F,deck,pos,mode="cards",S=new Map(),busy=false;
const ok=()=>F.items.filter(i=>S.get(i)===1),no=()=>F.items.filter(i=>S.get(i)===-1);
function home(){
  const g=(cat,t)=>`<h2>${t}</h2><div class="grid">`+D.faixas.filter(f=>f.cat===cat).map(f=>`<button class="bt" data-f="${f.faixa}" style="background:${TH[f.faixa][0]};color:${TH[f.faixa][1]};${f.faixa==="Preta"?"box-shadow:inset 0 -5px 0 #dc2626":""}"><b>${f.faixa}</b><small>${f.items.length} itens</small></button>`).join("")+`</div>`;
  $("app").innerHTML=`<div class="pad"><h1>Guia de Estudos</h1><div class="mut">De La Riva Floripa · cartas e lista</div>${g("Infantil/Juvenil","Infantil / Juvenil")}${g("Adulto","Adulto")}<p class="mut" style="font-size:.85rem;margin-top:20px">Nas cartas, deslize para a direita se você sabe e para a esquerda se precisa estudar. Também dá para ver tudo em lista.</p></div>`;
  $("app").onclick=e=>{const b=e.target.closest("[data-f]");if(b){mode="cards";start(b.dataset.f,null,true)}};
}
function start(n,items,fresh){F=D.faixas.find(x=>x.faixa===n);
  if(fresh)F.items.forEach(i=>S.delete(i));
  if(items)items.forEach(i=>S.delete(i));
  deck=shuf(items||F.items.filter(i=>!S.has(i)));pos=0;screen()}
function head(){const[c,t]=TH[F.faixa];
  return `<div class="hd" style="background:${c};color:${t};${F.faixa==="Preta"?"border-bottom:5px solid #d4a017":""}"><button class="back" id="bk">← Voltar</button><h1>Faixa ${F.faixa}</h1></div>
  <div class="tabs"><button data-m="cards" class="${mode==="cards"?"on":""}">🃏 Cartas</button><button data-m="list" class="${mode==="list"?"on":""}">📋 Lista</button></div>`}
function tabsBind(){$("bk").onclick=home;document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;if(mode==="cards"){deck=shuf(F.items.filter(i=>!S.has(i)));pos=0}screen()})}
function bar(){return F.faixa==="Preta"?"#d4a017":TH[F.faixa][0]}
function screen(){
  if(mode==="list")return listView();
  $("app").innerHTML=head()+`<div class="cn"><span id="c1"></span><span id="c2"></span></div><div class="pb"><i id="pf" style="background:${bar()}"></i></div>
  <div class="stage" id="st"></div><div class="act"><button class="rb n" id="bn" aria-label="Preciso estudar">✕</button><button class="rb s" id="bs" aria-label="Eu sei">✓</button></div><div class="hint">← estudar · sei →</div>`;
  tabsBind();$("bn").onclick=()=>decide(-1);$("bs").onclick=()=>decide(1);draw();
}
function cardHTML(i,top){const[ic,ty]=kind(i.n);return `<div class="card ${top?"":"back2"}" ${top?'id="cd"':""}><span class="lb ok">SEI</span><span class="lb no">ESTUDAR</span><div class="ic">${ic}</div><div class="ty">${ty}</div><div class="nm">${esc(i.n)}</div>${i.q>0?`<div class="qt">Executar ×${i.q}</div>`:i.q<0?'<div class="qt">Todos</div>':""}<a class="yt" target="_blank" rel="noopener" href="${yt(i)}">▶ Ver no YouTube</a></div>`}
function draw(){
  if(pos>=deck.length)return end();
  $("c1").textContent=`Carta ${pos+1} / ${deck.length}`;$("c2").textContent=`✓ ${ok().length}  ·  ✕ ${no().length}`;$("pf").style.width=Math.round(pos/deck.length*100)+"%";
  $("st").innerHTML=(deck[pos+1]?cardHTML(deck[pos+1],false):"")+cardHTML(deck[pos],true);bind();
}
function bind(){
  const el=$("cd");let x0=null,dx=0;
  el.onpointerdown=e=>{if(e.target.closest("a"))return;x0=e.clientX;dx=0;el.setPointerCapture(e.pointerId);el.style.transition="none"};
  el.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;el.querySelector(".ok").style.opacity=Math.max(0,dx/110);el.querySelector(".no").style.opacity=Math.max(0,-dx/110)};
  const up=()=>{if(x0===null)return;x0=null;if(Math.abs(dx)>110)decide(dx>0?1:-1);else{el.style.transition="transform .2s";el.style.transform="";el.querySelector(".ok").style.opacity=el.querySelector(".no").style.opacity=0}};
  el.onpointerup=up;el.onpointercancel=up;
}
function decide(d){
  if(mode!=="cards"||busy||pos>=deck.length)return;busy=true;const el=$("cd");
  el.style.transition="transform .28s ease-out,opacity .28s";el.style.transform=`translateX(${d*520}px) rotate(${d*22}deg)`;el.style.opacity=0;
  S.set(deck[pos],d);
  setTimeout(()=>{pos++;busy=false;draw()},260);
}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")decide(1);if(e.key==="ArrowLeft")decide(-1)});
function listView(){
  $("app").innerHTML=head()+`<div class="cn"><span id="l1"></span><span id="l2"></span></div><div class="pb"><i id="pf" style="background:${bar()}"></i></div>
  <div class="lw">`+F.items.map((i,k)=>`<div class="li"><button class="sb" data-k="${k}" aria-label="Alterar status"></button><div class="lnm">${kind(i.n)[0]} ${esc(i.n)}${i.q>0?`<small>Executar ×${i.q}</small>`:i.q<0?"<small>Todos</small>":""}</div><a class="yt" target="_blank" rel="noopener" href="${yt(i)}">▶ YouTube</a></div>`).join("")+`</div><div class="hint" style="padding-bottom:20px">Toque no círculo: ✓ sei · ✕ estudar · vazio = pendente</div>`;
  tabsBind();
  const up=()=>{document.querySelectorAll(".sb").forEach(b=>{const v=S.get(F.items[+b.dataset.k]);b.className="sb"+(v===1?" s":v===-1?" n":"");b.textContent=v===1?"✓":v===-1?"✕":""});
    const o=ok().length,n=no().length;$("l1").textContent=`✓ ${o}  ·  ✕ ${n}`;$("l2").textContent=`${F.items.length-o-n} pendentes`;$("pf").style.width=Math.round((o+n)/F.items.length*100)+"%"};
  document.querySelector(".lw").onclick=e=>{const b=e.target.closest(".sb");if(!b)return;const i=F.items[+b.dataset.k],v=S.get(i);if(v===undefined)S.set(i,1);else if(v===1)S.set(i,-1);else S.delete(i);up()};
  up();
}
function end(){
  const o=ok().length,p=no();
  $("app").innerHTML=head()+`<div class="pad"><h1>${o} de ${F.items.length} na ponta da língua 🎉</h1>
  ${p.length?`<h2>Para estudar (${p.length})</h2><div class="ls">${p.map(i=>`<a target="_blank" rel="noopener" href="${yt(i)}"><span>${kind(i.n)[0]} ${esc(i.n)}</span><span>▶</span></a>`).join("")}</div><button class="big" id="rv">Revisar só os que faltam</button>`:'<p class="mut">Nenhuma pendência. Ótimo!</p>'}
  <button class="big" id="rs">Recomeçar a faixa</button></div>`;
  tabsBind();$("rs").onclick=()=>start(F.faixa,null,true);if(p.length)$("rv").onclick=()=>start(F.faixa,p);
}
home();
</script></body></html>
